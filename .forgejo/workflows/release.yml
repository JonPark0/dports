name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.2.0)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Invalid tag format: $TAG (must start with v followed by a digit)"
            exit 1
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: apt-get update && apt-get install -y git curl make jq dpkg

      - name: Checkout repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORGEJO_HOST="${{ vars.FORGEJO_URL }}"
          FORGEJO_HOST="${FORGEJO_HOST#https://}"
          git clone --depth 1 --branch "${{ steps.tag.outputs.TAG }}" \
            "https://x-token-auth:${TOKEN}@${FORGEJO_HOST}/${{ github.repository }}.git" .

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update version in source files
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^DPORTS_VERSION=.*/DPORTS_VERSION=\"${VERSION}\"/" dports.bash
          sed -i "s/^set -g DPORTS_VERSION.*/set -g DPORTS_VERSION \"${VERSION}\"/" dports.fish
          sed -i "s/^VERSION=.*/VERSION=\"${VERSION}\"/" install.sh

      - name: Build Debian packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist

          for ARCH in all amd64 arm64 armhf; do
            make deb ARCH="$ARCH"
            mv "dports_${VERSION}_${ARCH}.deb" "dist/"
          done

      - name: Upload to Forgejo package registry
        run: |
          for DEB in dist/*.deb; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --user "${{ vars.FORGEJO_OWNER }}:${{ secrets.PKG_TOKEN }}" \
              --upload-file "$DEB" \
              "${{ vars.FORGEJO_URL }}/api/packages/${{ vars.FORGEJO_OWNER }}/debian/pool/stable/main/upload")
            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "409" ]; then
              echo "Upload failed for $DEB with HTTP $HTTP_CODE"
              exit 1
            fi
            echo "Uploaded $(basename $DEB) — HTTP $HTTP_CODE"
          done

      - name: Create Forgejo release
        id: create_release
        run: |
          FORGEJO_URL="${{ vars.FORGEJO_URL }}"
          FORGEJO_OWNER="${{ vars.FORGEJO_OWNER }}"
          REPO="${{ github.event.repository.name }}"
          TAG="${{ steps.tag.outputs.TAG }}"

          cat > /tmp/release-body.md << EOF
          ## Install via apt

          \`\`\`bash
          # Add repository key
          curl -sS "${FORGEJO_URL}/api/packages/${FORGEJO_OWNER}/debian/repository.key" \\
            | gpg --dearmor \\
            | sudo tee /usr/share/keyrings/forgejo-dports.gpg > /dev/null

          # Add repository
          ARCH="\$(dpkg --print-architecture)"
          echo "deb [arch=\${ARCH} signed-by=/usr/share/keyrings/forgejo-dports.gpg] ${FORGEJO_URL}/api/packages/${FORGEJO_OWNER}/debian stable main" \\
            | sudo tee /etc/apt/sources.list.d/dports.list

          # Install
          sudo apt update && sudo apt install dports
          \`\`\`

          Or download the \`.deb\` from the assets below.
          EOF

          EXISTING_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${FORGEJO_URL}/api/v1/repos/${FORGEJO_OWNER}/${REPO}/releases/tags/${TAG}" \
            | jq -r '.id // empty')

          if [ -n "$EXISTING_ID" ]; then
            RELEASE_ID="$EXISTING_ID"
          else
            RELEASE_JSON=$(jq -n \
              --arg tag  "$TAG" \
              --arg name "dports $TAG" \
              --rawfile body /tmp/release-body.md \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')

            RELEASE_ID=$(curl -sf -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${FORGEJO_URL}/api/v1/repos/${FORGEJO_OWNER}/${REPO}/releases" \
              -d "$RELEASE_JSON" | jq -r '.id')
          fi

          echo "RELEASE_ID=${RELEASE_ID}" >> $GITHUB_OUTPUT

      - name: Upload .deb to release assets
        run: |
          for DEB in dist/*.deb; do
            DEB_NAME="$(basename "$DEB")"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.debian.binary-package" \
              --data-binary @"$DEB" \
              "${{ vars.FORGEJO_URL }}/api/v1/repos/${{ vars.FORGEJO_OWNER }}/${{ github.event.repository.name }}/releases/${{ steps.create_release.outputs.RELEASE_ID }}/assets?name=${DEB_NAME}")
            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "409" ]; then
              echo "Asset upload failed for $DEB_NAME with HTTP $HTTP_CODE"
              exit 1
            fi
            echo "Uploaded $DEB_NAME — HTTP $HTTP_CODE"
          done
