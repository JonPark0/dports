name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "DEB_NAME=dports_${VERSION}_all.deb" >> $GITHUB_OUTPUT

      - name: Update version in source files
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^DPORTS_VERSION=.*/DPORTS_VERSION=\"${VERSION}\"/" dports.bash
          sed -i "s/^set -g DPORTS_VERSION.*/set -g DPORTS_VERSION \"${VERSION}\"/" dports.fish
          sed -i "s/^VERSION=.*/VERSION=\"${VERSION}\"/" install.sh

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y make dpkg

      - name: Build Debian package
        run: make deb

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "dports ${{ github.ref_name }}" \
            --notes "$(cat <<'EOF'
          ## Install via apt

          ```bash
          # Add repository key
          curl -sS "https://git.palnarium.com/api/packages/jonpark0/debian/repository.key" \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/forgejo-dports.gpg > /dev/null

          # Add repository
          echo "deb [signed-by=/usr/share/keyrings/forgejo-dports.gpg] https://git.palnarium.com/api/packages/jonpark0/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/dports.list

          # Install
          sudo apt update && sudo apt install dports
          ```

          Or download the `.deb` from the assets below.
          EOF
          )" \
            "${{ steps.version.outputs.DEB_NAME }}"
